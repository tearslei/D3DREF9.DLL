[startup]
delay_ms=150000
run_once_per_process=true

[macro]
enabled=true
emergency_stop=false
; - 键不再注册

[instant_sniper]
; 触发键待老板确认；默认 F6 仅用于本地时序验证
trigger_vk=VK_F6
random_1_max_ms=100
random_2_max_ms=100
key3_delay_ms=35
base_cooldown_ms=1350
total_cycle_ms=1600
; 为满足总时长 1600ms，实际冷却 = 1565-R1-R2
