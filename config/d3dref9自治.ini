[startup]
delay_ms=150000
run_once_per_process=true

[macro]
enabled=true
emergency_stop=false
; - 键不再注册

[aim]
; 普通模式总开关默认关闭；按左Alt+Z开启后，必须物理按住鼠标左键才运行自瞄与自动开火。
; TCII 源码的“微型”范围值为 16：屏幕半宽=width/(1+16)，半高同理。
; 填写正数时改用像素半径；保持 0 可复现源码的微型范围。
micro_range_divisor=16
micro_radius_px=0
; 对五个骨点组成的身体代理增加少量像素填充，模拟“任意身体像素”。
body_padding_px=4
; 短暂锁定避免目标在两个相邻像素之间抖动；最近目标仍会立即抢占。
lock_hold_ms=80
switch_margin_px=3
auto_fire_interval_ms=130
; 障碍判断开启；射线函数不可用/异常时拒绝目标（fail-closed）。
visibility_required=true
visibility_fail_closed=true
; 瞬狙使用中型准心范围：宽高约为视口的 1/(1+8)。普通模式仍使用微型 1/(1+16)。
instant_range_divisor=8

[instant_sniper]
; 瞬狙触发：仅鼠标右键；普通模式由鼠标左键按住作为激活门控
trigger_mouse=right
scope_delay_min_ms=15
scope_delay_max_ms=30
fire_hold_min_ms=8
fire_hold_max_ms=15
unscope_delay_min_ms=10
unscope_delay_max_ms=25
recovery_min_ms=30
recovery_max_ms=80
cooldown_min_ms=180
cooldown_max_ms=300
pause_aim=true
pause_auto_fire=true
